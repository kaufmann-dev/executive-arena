name = "best-bet"
rank_1_meaning = "the strongest risk-adjusted investment bet given the evidence and what the price appears to assume"
prompt = "Rank the stocks as risk-adjusted bets, not as businesses.\n\nA great business can be a poor bet when its greatness is already priced in, while a flawed business\ncan be a strong bet when the price assumes catastrophe. For every stock:\n\n1. Name the company-specific load-bearing question that decides the investment now.\n2. Read the fresh, dated evidence against that question.\n3. Infer what the current relative valuation appears to assume.\n4. Resolve the sharpest conflict between the signals instead of averaging it away.\n5. Commit to a differentiated, falsifiable thesis and state what would prove it wrong.\n\nRank the group from best bet to worst bet. Prefer the thesis with the strongest evidence-adjusted\nupside and downside asymmetry, not the most famous company, the highest-quality company, or the\ncheapest-looking multiple. Use only the supplied evidence and cite its evidence IDs.\n"
